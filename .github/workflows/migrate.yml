name: Database Migrations

on:
  push:
    branches: ['main']
    paths:
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
  pull_request:
    branches: ['main']
    paths:
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
  workflow_dispatch: # Allow manual trigger
    inputs:
      environment:
        description: 'Environment to run migrations'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Validate Prisma schema
        run: cd packages/database && npx prisma validate

      - name: Check migration status
        run: cd packages/database && npx prisma migrate status
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db

  run-migrations-staging:
    name: Run Migrations (Staging)
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Run migrations (dry-run)
        run: |
          cd packages/database
          echo "🔍 Checking migration status..."
          npx prisma migrate status

          echo "📝 Migration plan:"
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-schema-datasource prisma/schema.prisma \
            --script || echo "No pending migrations"
        env:
          DATABASE_URL: ${{ secrets.AWS_RDS_DATABASE_URL_STAGING }}

      - name: Deploy migrations
        run: cd packages/database && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.AWS_RDS_DATABASE_URL_STAGING }}

      - name: Generate Prisma Client
        run: cd packages/database && npx prisma generate

      - name: Verify migration
        run: |
          cd packages/database
          echo "✅ Migration completed successfully"
          npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.AWS_RDS_DATABASE_URL_STAGING }}

  run-migrations-production:
    name: Run Migrations (Production)
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Backup database (optional - requires AWS CLI)
        run: |
          echo "🗄️ Creating RDS snapshot before migration..."
          # Uncomment if AWS CLI is configured
          # aws rds create-db-snapshot \
          #   --db-instance-identifier your-db-instance \
          #   --db-snapshot-identifier migration-backup-$(date +%Y%m%d-%H%M%S)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        continue-on-error: true

      - name: Check migration status
        run: |
          cd packages/database
          echo "🔍 Checking migration status..."
          npx prisma migrate status

          echo "📝 Migration plan:"
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-schema-datasource prisma/schema.prisma \
            --script || echo "No pending migrations"
        env:
          DATABASE_URL: ${{ secrets.AWS_RDS_DATABASE_URL }}

      - name: Deploy migrations
        run: cd packages/database && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.AWS_RDS_DATABASE_URL }}

      - name: Generate Prisma Client
        run: cd packages/database && npx prisma generate

      - name: Verify migration
        run: |
          cd packages/database
          echo "✅ Migration completed successfully"
          npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.AWS_RDS_DATABASE_URL }}

      - name: Notify on success
        if: success()
        run: |
          echo "🎉 Production database migration completed successfully!"
          echo "Timestamp: $(date)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Production database migration failed!"
          echo "Please check logs and consider rolling back."
          exit 1
