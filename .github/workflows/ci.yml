name: CI

on:
  pull_request:
    branches: ['main', 'dev', 'staging']

env:
  # Database URL for Prisma operations (validation, format check)
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/titans_tech

jobs:
  # Shared setup job - installs dependencies once and caches for all other jobs
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    outputs:
      node-modules-cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}
      prisma-cache-hit: ${{ steps.cache-prisma.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Cache Prisma Client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: packages/database/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'package-lock.json') }}

      - name: Generate Prisma Client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Restore Prisma Client cache
        uses: actions/cache@v4
        with:
          path: packages/database/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'package-lock.json') }}

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Run ESLint
        run: npm run lint

  format:
    name: Format
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Restore Prisma Client cache
        uses: actions/cache@v4
        with:
          path: packages/database/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'package-lock.json') }}

      - name: Check Prettier formatting
        run: npx prettier --check "**/*.{ts,tsx,md,json}"

      - name: Check Prisma schema formatting
        run: cd packages/database && npx prisma format --check

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Restore Prisma Client cache
        uses: actions/cache@v4
        with:
          path: packages/database/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'package-lock.json') }}

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build all packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/dashboard/.next
            apps/backend/dist
            packages/database/dist
            packages/shared/dist
          retention-days: 1

  prisma:
    name: Prisma Validation
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Restore Prisma Client cache
        uses: actions/cache@v4
        with:
          path: packages/database/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'package-lock.json') }}

      - name: Validate Prisma schema
        run: cd packages/database && npx prisma validate

      - name: Check Prisma schema format
        run: cd packages/database && npx prisma format --check

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --debug --only-verified

  test:
    name: E2E Tests
    needs: [setup, build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: titans_tech
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Restore Prisma Client cache
        uses: actions/cache@v4
        with:
          path: packages/database/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'package-lock.json') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json 2>/dev/null | jq -r '.dependencies["@playwright/test"].version // empty')" >> $GITHUB_OUTPUT
        working-directory: apps/dashboard

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/dashboard

      - name: Install Playwright system dependencies
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/dashboard

      - name: Create environment files
        run: |
          cp apps/backend/.env.example apps/backend/.env
          cp apps/dashboard/.env.example apps/dashboard/.env
          cp packages/database/.env.example packages/database/.env

      - name: Setup database
        run: cd packages/database && npx prisma migrate reset --force

      - name: Start backend server
        run: npx turbo run dev --filter=@titans-tech/backend &

      - name: Wait for backend server
        run: npx wait-on http://localhost:3001 --timeout 60000

      - name: Start dashboard app
        working-directory: apps/dashboard
        run: npm run start &

      - name: Wait for dashboard
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        working-directory: apps/dashboard
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 30
