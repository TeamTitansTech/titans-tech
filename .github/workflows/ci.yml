name: CI

on:
  pull_request:
    branches: ['main', 'dev', 'staging']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Run ESLint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Check Prettier formatting
        run: npx prettier --check "**/*.{ts,tsx,md,json}"

      - name: Check Prisma schema formatting
        run: cd packages/database && npx prisma format --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Build all packages
        run: npm run build

  prisma:
    name: Prisma Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/db
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Validate Prisma schema
        run: cd packages/database && npx prisma validate

      - name: Check Prisma schema format
        run: cd packages/database && npx prisma format --check

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # Skip on push to main (already scanned in PR)
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --debug --only-verified
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/titans_tech
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/titans_tech
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Start Docker Compose services
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL to be ready
        run: |
          until docker compose exec postgres pg_isready -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Create environment files
        run: |
          cp apps/backend/.env.example apps/backend/.env
          cp apps/dashboard/.env.example apps/dashboard/.env

      - name: Setup database
        run: |
          cd packages/database
          npx prisma migrate reset --force

      - name: Install Playwright Browsers
        working-directory: apps/dashboard
        run: npx playwright install --with-deps

      - name: Run backend server
        run: |
          npx turbo run dev --filter=@titans-tech/backend &

      - name: Wait for backend server
        run: sleep 45

      - name: Build and start dashboard app
        working-directory: apps/dashboard
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000

      - name: Run Playwright tests
        working-directory: apps/dashboard
        run: npx playwright test

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
