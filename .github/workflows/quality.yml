name: Code Quality

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  circular-dependencies:
    name: Circular Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check circular dependencies in backend
        run: |
          npx madge --circular --extensions ts apps/backend/src
          if [ $? -ne 0 ]; then
            echo "❌ Circular dependencies found in backend"
            exit 1
          fi

      - name: Check circular dependencies in dashboard
        run: |
          npx madge --circular --extensions ts,tsx apps/dashboard/src
          if [ $? -ne 0 ]; then
            echo "❌ Circular dependencies found in dashboard"
            exit 1
          fi

      - name: Check circular dependencies in packages
        run: |
          npx madge --circular --extensions ts packages/shared/src packages/database/src
          if [ $? -ne 0 ]; then
            echo "❌ Circular dependencies found in packages"
            exit 1
          fi

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Check docker-compose syntax
        run: |
          if ! docker compose config --quiet; then
            echo "❌ Docker Compose configuration is invalid"
            exit 1
          fi
          echo "✅ Docker Compose configuration is valid"

  workspace-validation:
    name: Workspace Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate workspaces
        run: npm ls --all

      - name: Check for duplicate dependencies
        run: |
          echo "Checking for duplicate dependencies across workspaces..."
          npm dedupe --dry-run

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for unused dependencies
        run: |
          npx depcheck apps/backend --ignores="@types/*,eslint*,prettier,typescript"
          npx depcheck apps/dashboard --ignores="@types/*,eslint*,prettier,typescript"
          npx depcheck packages/database --ignores="@types/*,prisma,typescript"
          npx depcheck packages/shared --ignores="@types/*,typescript"

  outdated-dependencies:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated dependencies
        run: |
          echo "📦 Checking for outdated dependencies..."
          npm outdated || true

      - name: Generate outdated report
        run: |
          npm outdated --json > outdated-report.json || true

      - name: Upload outdated report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-report
          path: outdated-report.json
          retention-days: 7

  turborepo-validation:
    name: Turborepo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Turborepo configuration
        run: |
          echo "Validating Turborepo configuration..."
          npx turbo run build --dry=json > turbo-dry-run.json

      - name: Check Turborepo cache
        run: |
          echo "Checking Turborepo cache configuration..."
          npx turbo run build --summarize

  package-json-validation:
    name: Package.json Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Validate package.json files
        run: |
          echo "Validating package.json files..."
          for pkg in package.json apps/*/package.json packages/*/package.json; do
            if [ -f "$pkg" ]; then
              echo "Checking $pkg..."
              node -e "JSON.parse(require('fs').readFileSync('$pkg', 'utf8'))"
            fi
          done

      - name: Check for consistent versions
        run: |
          echo "Checking for version consistency..."
          # Check that all packages use the same TypeScript version
          grep -h "\"typescript\":" package.json apps/*/package.json packages/*/package.json | sort -u

  quality-success:
    name: Quality Success
    runs-on: ubuntu-latest
    needs:
      [
        circular-dependencies,
        docker-validation,
        workspace-validation,
        dependency-check,
        turborepo-validation,
        package-json-validation,
      ]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "❌ One or more quality checks failed"
            exit 1
          elif [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "⚠️ One or more quality checks were cancelled"
            exit 1
          else
            echo "✅ All quality checks passed"
          fi
