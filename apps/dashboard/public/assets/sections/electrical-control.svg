<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .cls-1 {
        fill: none;
        stroke: #000;
        stroke-miterlimit: 10;
        stroke-width: 3px;
      }
    </style>
  </defs>
  <!-- Control Panel Box -->
  <rect class="cls-1" x="15" y="10" width="70" height="80" rx="3"/>
  <!-- Panel Door Lines -->
  <line class="cls-1" x1="50" y1="10" x2="50" y2="90"/>
  <!-- Lightning Bolt Symbol (Left Panel) -->
  <polygon class="cls-1" points="38,25 28,50 35,50 27,75 42,45 35,45 38,25"/>
  <!-- Circuit Symbol (Right Panel) -->
  <circle class="cls-1" cx="67" cy="35" r="8"/>
  <line class="cls-1" x1="67" y1="43" x2="67" y2="55"/>
  <rect class="cls-1" x="60" y="55" width="14" height="8"/>
  <line class="cls-1" x1="67" y1="63" x2="67" y2="75"/>
  <circle class="cls-1" cx="67" cy="75" r="3"/>
  <!-- Control Buttons -->
  <circle class="cls-1" cx="32.5" cy="82" r="3"/>
</svg>
