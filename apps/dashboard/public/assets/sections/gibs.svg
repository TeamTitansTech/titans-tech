<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90">
  <defs>
    <style>
      .cube-line {
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Left cube -->
  <g transform="translate(17, 15)">
    <!-- Back face -->
    <polygon class="cube-line" points="10,8 50,8 50,55 10,55"/>
    <!-- Top face -->
    <polygon class="cube-line" points="10,8 25,0 65,0 50,8"/>
    <!-- Right face -->
    <polygon class="cube-line" points="50,8 65,0 65,47 50,55"/>
    <!-- Front edges -->
    <line class="cube-line" x1="10" y1="55" x2="25" y2="47"/>
    <line class="cube-line" x1="25" y1="47" x2="65" y2="47"/>
    <line class="cube-line" x1="25" y1="47" x2="25" y2="0"/>
  </g>

  <!-- Right cube with inner lines -->
  <g transform="translate(107, 15)">
    <!-- Back face -->
    <polygon class="cube-line" points="10,8 50,8 50,55 10,55"/>
    <!-- Top face -->
    <polygon class="cube-line" points="10,8 25,0 65,0 50,8"/>
    <!-- Right face -->
    <polygon class="cube-line" points="50,8 65,0 65,47 50,55"/>
    <!-- Front edges -->
    <line class="cube-line" x1="10" y1="55" x2="25" y2="47"/>
    <line class="cube-line" x1="25" y1="47" x2="65" y2="47"/>
    <line class="cube-line" x1="25" y1="47" x2="25" y2="0"/>

    <!-- Inner nested rectangle -->
    <rect class="cube-line" x="18" y="16" width="25" height="32" stroke-dasharray="3,2"/>
  </g>
</svg>