<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#4A90E2" opacity="0.1"/>

  <!-- Square/Reference surface -->
  <rect x="40" y="110" width="80" height="8" fill="#4A90E2" stroke="#4A90E2" stroke-width="2"/>
  <rect x="40" y="70" width="8" height="48" fill="#4A90E2" stroke="#4A90E2" stroke-width="2"/>

  <!-- Slide/Surface being measured -->
  <line x1="120" y1="60" x2="160" y2="140" stroke="#4A90E2" stroke-width="4"/>

  <!-- Indicator -->
  <circle cx="140" cy="100" r="8" fill="#4A90E2"/>
  <line x1="120" y1="100" x2="140" y2="100" stroke="#4A90E2" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Angle measurement arc -->
  <path d="M 48 110 Q 55 95, 70 85" stroke="#FF6B35" stroke-width="2" fill="none"/>

  <!-- Right angle indicator -->
  <rect x="44" y="106" width="8" height="8" fill="none" stroke="#FF6B35" stroke-width="1.5"/>

  <!-- Measurement points F-R and L-R indicators -->
  <text x="145" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4A90E2">
    F-R
  </text>
  <text x="145" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4A90E2">
    L-R
  </text>

  <!-- Measurement lines -->
  <line x1="120" y1="60" x2="145" y2="60" stroke="#4A90E2" stroke-width="1.5"/>
  <line x1="160" y1="140" x2="145" y2="140" stroke="#4A90E2" stroke-width="1.5"/>

  <!-- Text label -->
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4A90E2" text-anchor="middle">
    ANGULARITY
  </text>
</svg>
