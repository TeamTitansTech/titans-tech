<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base rectangle representing the press slide -->
  <rect x="20" y="60" width="60" height="25" fill="#94a3b8" stroke="#475569" stroke-width="2" rx="2"/>

  <!-- Vertical reference line -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Angle indicator - measuring tool -->
  <circle cx="50" cy="40" r="3" fill="#3b82f6"/>
  <line x1="50" y1="40" x2="50" y2="15" stroke="#3b82f6" stroke-width="2.5"/>
  <line x1="50" y1="40" x2="70" y2="25" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Angle arc -->
  <path d="M 50 25 A 15 15 0 0 1 60 20" stroke="#3b82f6" stroke-width="1.5" fill="none"/>

  <!-- Perpendicularity symbol (90 degree marker) -->
  <rect x="48" y="23" width="7" height="7" fill="none" stroke="#3b82f6" stroke-width="1"/>

  <!-- Measurement indicator -->
  <text x="65" y="22" font-family="Arial, sans-serif" font-size="10" fill="#475569" font-weight="bold">θ</text>

  <!-- Title -->
  <text x="50" y="98" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="600">ANGULARITY</text>
</svg>
